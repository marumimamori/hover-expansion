name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check plugin behavior
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Verify release files and version
        run: node scripts/verify-release.cjs "$GITHUB_REF_NAME"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          notes="docs/releases/${tag}.md"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "$tag" --notes-file "$notes" --draft
          fi
          assets=(main.js manifest.json)
          if [ -f styles.css ]; then
            assets+=(styles.css)
          fi
          gh release upload "$tag" "${assets[@]}" --clobber
          gh release edit "$tag" --title "$tag" --notes-file "$notes" --draft=false --latest
